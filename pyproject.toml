[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffetch-cli"
version = "0.1.0"
description = "Smart GitHub repository discovery CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  {name = "davinci"},
]
keywords = ["cli", "github", "search", "repositories", "developer-tools"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
]
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "rich>=13.7.0,<14.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Damascus-dev/forkfetch"
Repository = "https://github.com/Damascus-dev/forkfetch"
Issues = "https://github.com/Damascus-dev/forkfetch/issues"

[project.scripts]
ffetch = "fetcher.main:app"

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "twine>=5.1.1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
