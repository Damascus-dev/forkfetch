name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  install-and-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Verify CLI entry point
        run: ffetch --help

      - name: Verify module entry point
        run: python -m fetcher --help

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
